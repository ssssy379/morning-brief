name: 아침 신문 브리핑

on:
  schedule:
    # GitHub 시간은 UTC 기준: 23:30 UTC = 한국시간 오전 8:30
    - cron: "30 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 브리핑 만들기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_news.py
      - name: 결과 저장
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "브리핑 $(TZ=Asia/Seoul date +%F)"
          git push
