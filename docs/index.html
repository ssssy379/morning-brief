<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아침 신문 브리핑</title>
<meta name="description" content="뉴욕타임즈 · 워싱턴포스트 · 한국경제 오늘의 주요 기사 5선">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f6f3ee;
    --surface: #ffffff;
    --text: #1d1d1f;
    --muted: #6b6b70;
    --line: #e4dfd6;
    --accent: #b3261e;
    --chip: #f0ebe3;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --surface: #202329;
      --text: #ececee;
      --muted: #9a9ca3;
      --line: #2e3138;
      --accent: #ff7a6e;
      --chip: #2a2e35;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Noto Sans KR", -apple-system, system-ui, "Apple SD Gothic Neo", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 14px) 16px 0;
  }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
  .date-pick { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0; padding: 4px 0; text-align: right; }
  .tabs { display: flex; gap: 4px; max-width: 680px; margin: 10px auto 0; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1 0 auto; font: inherit; font-size: 15px; font-weight: 600;
    color: var(--muted); background: none; border: 0; padding: 10px 12px 12px;
    border-bottom: 2.5px solid transparent; cursor: pointer; white-space: nowrap;
  }
  .tab[aria-selected="true"] { color: var(--text); border-color: var(--accent); }
  main { max-width: 680px; margin: 0 auto; padding: 16px; }
  .meta { font-size: 13px; color: var(--muted); margin: 2px 2px 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px 18px 16px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .rank { font-weight: 800; color: var(--accent); font-size: 15px; font-variant-numeric: tabular-nums; }
  .cat { font-size: 12px; background: var(--chip); color: var(--muted); padding: 2px 9px; border-radius: 99px; }
  .card h2 { font-size: 17.5px; line-height: 1.45; margin: 0 0 4px; letter-spacing: -.015em; word-break: keep-all; }
  .orig { font-size: 13px; color: var(--muted); margin: 0 0 10px; font-style: italic; line-height: 1.45; }
  .summary { font-size: 15.5px; margin: 8px 0 14px; word-break: keep-all; }
  .src {
    display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600;
    color: var(--accent); text-decoration: none; padding: 8px 0 2px;
  }
  .src svg { width: 14px; height: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 16px; }
  footer { max-width: 680px; margin: 0 auto; padding: 8px 16px 32px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>아침 신문 브리핑</h1>
    <select class="date-pick" id="datePick" aria-label="날짜 선택"></select>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main id="main"><p class="empty">불러오는 중…</p></main>
<footer>요약은 AI가 기사 제목과 리드 문장을 바탕으로 작성했어요. 정확한 내용은 원문 링크에서 확인하세요. 매일 오전 8:30 업데이트.</footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const linkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';

let briefing = null;
let current = localGet("tab") || "nyt";

function localGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

function formatDate(iso) {
  const d = new Date(iso + "T00:00:00+09:00");
  return d.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short", timeZone: "Asia/Seoul" });
}

async function loadJSON(path) {
  const res = await fetch(path, { cache: "no-cache" });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

function renderTabs() {
  $("tabs").innerHTML = briefing.sources.map((s) =>
    `<button class="tab" role="tab" data-id="${esc(s.id)}" aria-selected="${s.id === current}">${esc(s.name)}</button>`
  ).join("");
}

function renderSource() {
  const src = briefing.sources.find((s) => s.id === current) || briefing.sources[0];
  current = src.id;
  if (!src.articles.length) {
    $("main").innerHTML = `<p class="empty">${esc(src.error || "기사가 없어요.")}</p>`;
    return;
  }
  const time = new Date(briefing.generated_at).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit", timeZone: "Asia/Seoul" });
  $("main").innerHTML =
    `<p class="meta">${esc(src.name_en)} · ${esc(formatDate(briefing.date))} ${esc(time)} 정리</p>` +
    src.articles.map((a, i) => `
      <article class="card">
        <div class="card-head"><span class="rank">${i + 1}</span><span class="cat">${esc(a.category)}</span></div>
        <h2>${esc(a.title_ko)}</h2>
        ${a.title_original ? `<p class="orig">${esc(a.title_original)}</p>` : ""}
        <p class="summary">${esc(a.summary_ko)}</p>
        <a class="src" href="${esc(a.url)}" target="_blank" rel="noopener">원문 보기 · ${esc(src.name)} ${linkIcon}</a>
      </article>`).join("");
}

async function showDate(date) {
  try {
    briefing = await loadJSON(date ? `data/${date}.json` : "data/latest.json");
    renderTabs();
    renderSource();
  } catch {
    $("main").innerHTML = '<p class="empty">아직 브리핑이 없어요.<br>매일 오전 8시 30분에 새로 만들어져요.</p>';
  }
}

$("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  current = btn.dataset.id;
  localSet("tab", current);
  renderTabs();
  renderSource();
  window.scrollTo({ top: 0 });
});

$("datePick").addEventListener("change", (e) => showDate(e.target.value));

(async () => {
  try {
    const dates = await loadJSON("data/index.json");
    $("datePick").innerHTML = dates.map((d, i) => `<option value="${d}">${i === 0 ? "오늘 · " : ""}${formatDate(d)}</option>`).join("");
  } catch {}
  showDate();
})();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
